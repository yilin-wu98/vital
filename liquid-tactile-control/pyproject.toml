[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-tactile-control"
version = "0.1.0"
description = "Diffusion-policy steering using visual and tactile world-model rewards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "latent-tactile==0.1.0", "anytouch-reward==0.1.0",
  "torch>=2.4,<2.8", "torchvision>=0.19,<0.23", "numpy>=1.26,<2",
  "einops>=0.8,<0.9", "h5py>=3.10", "scipy>=1.13", "pillow",
  "opencv-python>=4.10,<4.12", "matplotlib>=3.8", "imageio>=2.31",
  "imageio-ffmpeg>=0.4", "requests>=2.31", "easydict>=1.13",
  "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4",
  "diffusers>=0.31,<0.39", "transformers==4.42.3",
]

[project.scripts]
liquid-tactile = "liquid_tactile_control.run:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["liquid_tactile_control*"]

[tool.setuptools.package-data]
liquid_tactile_control = ["policy_backend/LICENSE.md"]
