[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-tactile"
version = "0.1.0"
description = "Action-conditioned tactile and visual latent world models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<2.8", "torchvision>=0.19,<0.23", "numpy>=1.26,<2",
  "h5py>=3.10", "einops>=0.8,<0.9", "scipy>=1.13", "pillow",
  "tqdm", "PyYAML>=6", "diffusers>=0.31,<0.39",
  "imageio>=2.31", "imageio-ffmpeg>=0.4", "matplotlib>=3.8",
]

[project.optional-dependencies]
decoder = ["lpips==0.1.4"]
tracking = ["wandb>=0.21,<0.28"]
encoding = ["anytouch-reward==0.1.0"]

[project.scripts]
tactile-train-wm = "dino_wm.train_dino_wm_tactile_k_step:main"
tactile-eval-wm = "dino_wm.eval_dino_wm_tactile_k_step:main"
tactile-train-decoder = "dino_wm.train_dino_decoder_tactile:main"

[tool.setuptools.packages.find]
include = ["dino_wm*"]

[tool.setuptools.package-data]
dino_wm = ["configs/*.yaml"]
